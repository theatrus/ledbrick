name: ESPHome Build

on:
  push:
    branches: [ master, main ]
    paths: [ 'firmware/**' ]
  pull_request:
    branches: [ master, main ]
    paths: [ 'firmware/**' ]

jobs:
  test:
    name: Run Unit Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        compiler: [gcc, clang]
        exclude:
          # macOS uses clang by default, skip gcc on macOS
          - os: macos-latest
            compiler: gcc
    
    steps:
    - name: Checkout source code
      uses: actions/checkout@v4
    
    - name: Install build dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y g++ clang
    
    - name: Install build dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        # macOS has clang pre-installed
        echo "Using built-in clang compiler"
    
    - name: Run unit tests
      working-directory: ./firmware
      run: |
        if [ "${{ matrix.compiler }}" = "clang" ]; then
          echo "Running unit tests with clang++ on ${{ matrix.os }}..."
          make clean
          make test-clang
        else
          echo "Running unit tests with g++ on ${{ matrix.os }}..."
          make clean
          make test
        fi

  build:
    runs-on: ubuntu-latest
    name: Build ESPHome firmware
    needs: test  # Only build if tests pass
    
    steps:
    - name: Checkout source code
      uses: actions/checkout@v4
    
    - name: Build ESPHome Binary
      uses: esphome/build-action@v6
      id: esphome-build
      with:
        yaml-file: firmware/ledbrick-plus.yaml
        version: '2026.9.1'
      env:
        # Mock secrets for compilation - valid format required for build
        SECRETS_api_encryption_key: "0InzFsPpuTBIm6B6HVhVupBRBwBTY2oT3fRnc3JATdM="
        SECRETS_ota_password: "mock_ota_password"
        SECRETS_wifi_ssid: "MockWiFi"
        SECRETS_wifi_password: "mock_password"