# Dump the ESP32-S3 registers that drive the LED channels: MCPWM (ADIM current), LEDC
# (EN/PWM dimming) and the GPIO matrix. Read only: no flash probing, no RTOS awareness.
# Halting stops the watchdogs, so reset the board afterwards.
#   openocd -s <tool-openocd-esp32>/share/openocd/scripts -f read_regs.cfg > dump.log 2>&1
set ESP_FLASH_SIZE 0
set ESP_RTOS none
source [find board/esp32s3-builtin.cfg]
init
halt
echo "=== MCPWM0 0x6001E000"
echo [capture {mdw 0x6001E000 74}]
echo "=== MCPWM1 0x6002C000"
echo [capture {mdw 0x6002C000 74}]
echo "=== LEDC 0x60019000"
echo [capture {mdw 0x60019000 56}]
echo "=== GPIO_FUNC_OUT_SEL 0x60004554 (GPIO0..48)"
echo [capture {mdw 0x60004554 49}]
echo "=== GPIO_FUNC_IN_SEL 0x60004154 (signals 0..63)"
echo [capture {mdw 0x60004154 64}]
resume
shutdown
