# ESPHome package for LED channel (PWM + Current control pair)
# Provides PWM light control, current control sliders with limiting, and scheduler integration
esphome:
  project:
    name: "ledbrick.channel"
    version: "2.0.0"

# Required substitutions:
# - channel_number: Channel identifier (e.g., "1", "2", etc.)
# - pwm_pin: GPIO pin for PWM output
# - current_pin: GPIO pin for current control output
#
# Each channel is a TPS922053. pwm_pin drives EN/PWM (on/off dimming). current_pin drives
# ADIM/HD, which the driver reads as a digital duty cycle: LED current = 2 A x duty.
# - ADIM runs at 10 kHz. The driver resolves 8 bits (about 8 mA) only up to 39 kHz. The
#   MCPWM timer counts at 10 MHz, so 10 kHz gives 1000 steps and the driver is the limit.
# - If ADIM stays low while EN/PWM pulses, the driver enters hybrid dimming and sets the
#   current from the PWM duty alone, up to 2 A. So EN/PWM is held off until the current is
#   high enough to pulse ADIM (see adim_on below).

globals:
  # Level the light asks for, applied to EN/PWM only while ADIM is pulsing
  - id: pwm_level_${channel_number}
    type: float
    initial_value: '0.0'
  - id: adim_on_${channel_number}
    type: bool
    initial_value: 'false'

output:
  - platform: mcpwm_unified
    id: pwm_hw_${channel_number}
    pin: ${pwm_pin}
    frequency: 1khz
    driver: ledc
  - platform: mcpwm_unified
    id: pwm_output_ao${channel_number}
    pin: ${current_pin}
    frequency: 10khz
    driver: mcpwm
  # The light writes here; EN/PWM follows it only while the current output is on
  - platform: template
    id: pwm_output_${channel_number}
    type: float
    write_action:
      - lambda: |-
          id(pwm_level_${channel_number}) = state;
          id(pwm_hw_${channel_number}).set_level(id(adim_on_${channel_number}) ? state : 0.0f);


light:
  - platform: monochromatic
    id: lpwm${channel_number}
    output: pwm_output_${channel_number}
    name: "Ch${channel_number} PWM"
    gamma_correct: 1
    restore_mode: ALWAYS_OFF
    on_turn_on:
      # Keep the channel dark for the whole thermal emergency, whoever turns it on
      - if:
          condition:
            lambda: 'return id(main_scheduler)->is_thermal_emergency();'
          then:
            - light.turn_off:
                id: lpwm${channel_number}
                transition_length: 0s

number:
  # Current control slider (0-2A)
  - platform: template
    id: current_${channel_number}
    name: "Ch${channel_number} Current"
    optimistic: true
    min_value: 0.0
    max_value: 2.0
    step: 0.01
    unit_of_measurement: "A"
    mode: slider
    restore_value: true
    initial_value: 0.0
    on_value:
      then:
        - lambda: |-
            float max_current = id(max_current_${channel_number}).state;
            float requested_current = x;
            float limited_current = min(requested_current, max_current);
            // No current to the LEDs during a thermal emergency
            if (id(main_scheduler)->is_thermal_emergency()) {
              limited_current = 0.0f;
            }
            
            // ADIM must pulse before EN/PWM turns the driver on, or it enters hybrid dimming.
            // The first pulse must be at least 1 us: 1% duty (20 mA) at 10 kHz. 50 mA gives
            // 2.5 us, leaving margin. Below that the channel is off.
            const float MIN_ADIM_CURRENT = 0.05f;
            bool adim_on = limited_current >= MIN_ADIM_CURRENT;
            if (!adim_on) {
              id(pwm_hw_${channel_number}).set_level(0.0f);
            }

            // Update the output (0-2A maps to 0-100% PWM)
            float pwm_value = adim_on ? limited_current / 2.0f : 0.0f;
            id(pwm_output_ao${channel_number}).set_level(pwm_value);

            if (adim_on && !id(adim_on_${channel_number})) {
              id(pwm_hw_${channel_number}).set_level(id(pwm_level_${channel_number}));
            }
            id(adim_on_${channel_number}) = adim_on;

            // If we had to limit, update the slider to show actual value
            if (limited_current != requested_current) {
              id(current_${channel_number}).publish_state(limited_current);
            }
  
  # Maximum current limit slider
  - platform: template
    id: max_current_${channel_number}
    name: "Ch${channel_number} Max Current"
    optimistic: true
    min_value: 0.0
    max_value: 2.0
    step: 0.01
    unit_of_measurement: "A"
    mode: slider
    restore_value: true
    initial_value: 1.0
    entity_category: config
    on_value:
      then:
        - lambda: |-
            id(main_scheduler)->set_channel_max_current(${channel_number} - 1, x);

# Channel color configuration
text_sensor:
  - platform: template
    name: "Ch${channel_number} Color"
    id: ch${channel_number}_color
    icon: "mdi:palette"
    lambda: |-
      return id(main_scheduler).get_channel_color(${channel_number} - 1);
    update_interval: 300s  # Longer interval since we update via events
    on_value:
      then:
        - lambda: |-
            ESP_LOGD("channel", "Ch${channel_number} color updated to: %s", x.c_str());

# Scheduler functionality is handled globally in the main config
